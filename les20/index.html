<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="body">

    <section>
      <p class="text-purple-700 text-center pt-10 pb-2">ТАРИФЫ</p>
      <p class="font-bold text-4xl text-center">Облако для всей семьи</p>
      <p class="text-gray-500 text-center py-3">
        Фото, документы и видео — всегда под рукой.
      </p>
    </section>

    <section>
      <div class="flex justify-center">
        <div
          class="border m-10 border-[2px] border-gray-300 w-[250px] p-5 rounded-2xl shadow-2xl font-bold"
        >
          <p>Базовый</p>
          <p class="text-2xl py-2">Бесплатно</p>
          <p class="text-gray-400">5 ГБ • 1 человек</p>
          <button class="bg-gray-200 px-[70px] py-1 my-2 rounded-lg">Выбрать</button>
        </div>

        <div
          class="bg-black text-white border m-10 border-[2px] border-gray-300 w-[250px] p-5 rounded-2xl shadow-2xl font-bold"
        >
          <p>Семейный</p>
          <p class="text-2xl py-2">29 с. / месяц</p>
          <p class="text-gray-400">200 ГБ • до 5 человек</p>
          <button class="bg-purple-500 px-[70px] py-1 my-2 rounded-lg">Выбрать</button>
        </div>

        <div
          class="border m-10 border-[2px] border-gray-300 w-[250px] p-5 rounded-2xl shadow-2xl font-bold"
        >
          <p>Про</p>
          <p class="text-2xl py-2">59 с. / месяц</p>
          <p class="text-gray-400">2 ТБ • до 6 человек</p>
          <button class="bg-gray-200 px-[70px] py-1 my-2 rounded-lg">Выбрать</button>
        </div>
      </div>
    </section>

    <section>
        <div>
            <h1 class="mx-[400px] my-4 text-purple-700 w-[460px] bg-purple-200 px-7 py-2 rounded-3xl">Первый месяц любого платного тарифа — бесплатно</h1>
        </div>
    </section>
    <script src="./main.js"></script>
  </body>
</html>
