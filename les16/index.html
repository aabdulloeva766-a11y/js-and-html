<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Food CRUD</title>
</head>

<body class="bg-orange-50">

    <div class="max-w-5xl mx-auto p-8">

        <h1 class="text-4xl font-bold text-center mb-8">
            🍔 Food Menu
        </h1>

        <div class="bg-white p-5 rounded-2xl shadow mb-8">

            <input
                class="name border p-3 rounded-lg mr-2"
                placeholder="Название еды"
            >

            <input
                class="price border p-3 rounded-lg mr-2"
                type="number"
                placeholder="Цена"
            >

            <input
                class="image border p-3 rounded-lg mr-2"
                placeholder="Ссылка на фото"
            >

            <button class="add bg-orange-500 text-white px-5 py-3 rounded-lg">
                Добавить
            </button>

        </div>

        <div class="foods grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    </div>

    <script src="main.js"></script>

</body>
</html>
